name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - website/**
      - puro/CHANGELOG.md
      - puro/lib/src/commands/**
      - installer/install.sh
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - name: Generate command reference and changelog
        working-directory: puro
        run: |
          dart pub get
          dart bin/puro2.dart _generate-docs
      - name: Build site
        working-directory: website
        run: PYTHONPATH=$PWD mkdocs build --strict
      - name: Add installer and CNAME
        run: |
          cp installer/install.sh website/site/install.sh
          echo puro2.phntm.xyz > website/site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
