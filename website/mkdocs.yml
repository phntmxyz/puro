site_name: Puro2
site_url: https://puro2.phntm.xyz
nav:
    - Home:
      - index.md
    - Reference:
      - reference/manual.md
      - reference/commands.md
      - reference/changelog.md
theme:
  name: material
  custom_dir: overrides
  logo: assets/puro_icon_small.png
  favicon: assets/puro_icon_small.png
  palette:
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.instant
    - toc.follow
    - content.code.annotate
markdown_extensions:
  - pm_attr_list:PMAttrListExtension
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phntmxyz/puro2
repo_url: https://github.com/phntmxyz/puro2
extra_css:
  - stylesheets/extra.css
